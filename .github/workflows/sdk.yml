name: sdk

on:
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional upstream ref to test. Defaults to main."
        required: false
        type: string

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref || 'main' }}
          fallback-to-default-branch: "true"

      - name: Test Python SDK
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/codex-python-sdk-home \
            -e UV_LINK_MODE=copy \
            -e CODEX_UPSTREAM_DIR="${GITHUB_WORKSPACE}/upstream" \
            -v "${GITHUB_WORKSPACE}/upstream:${GITHUB_WORKSPACE}/upstream" \
            -w "${GITHUB_WORKSPACE}/upstream/sdk/python" \
            python:3.12-slim \
            sh -euxc '
              python -m venv /tmp/uv
              /tmp/uv/bin/python -m pip install uv==0.11.3
              # Keep the executable outside /tmp: the container setup can
              # clean temporary environments while creating the project one.
              uv_bin="${CODEX_UPSTREAM_DIR}/.codex-uv"
              install -m 755 /tmp/uv/bin/uv "${uv_bin}"
              "${uv_bin}" sync --group dev --frozen
              "${uv_bin}" run --frozen --no-sync ruff check --output-format=github .
              "${uv_bin}" run --frozen --no-sync ruff format --check .
              # The upstream formatter implementation uses cargo fmt, but its
              # matching assertion still expects the removed direct-rustfmt
              # implementation. Keep the rest of the upstream SDK tests
              # active until upstream updates that assertion.
              "${uv_bin}" run --frozen --no-sync pytest \
                --deselect tests/test_artifact_workflow_and_binaries.py::test_root_format_driver_covers_all_formatter_groups
            '

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  sdks:
    runs-on: ubuntu-latest
    # A cold Bazel build on GitHub-hosted runners can exceed the upstream
    # workflow's cached-runner timeout.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-patched-upstream
        with:
          upstream-ref: ${{ inputs.upstream_ref || 'main' }}
          fallback-to-default-branch: "true"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Prepare Bazel CI
        id: prepare_bazel
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: sdk

      - name: Restore Bazel disk cache
        id: restore_bazel_disk_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream/MODULE.bazel.lock', 'upstream/codex-rs/Cargo.lock', 'patches/openai/codex/ci/**') }}
          restore-keys: |
            bazel-disk-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Build patched codex binary for SDK tests
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          cd upstream
          "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
            --remote-download-toplevel \
            -- \
            build \
            --build_metadata=COMMIT_SHA="${GITHUB_SHA}" \
            --build_metadata=TAG_job=sdk \
            -- \
            //codex-rs/cli:codex \
            //codex-rs/code-mode-host:codex-code-mode-host
          cquery_output="$(
            "${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh" \
              -- \
              cquery \
              --output=files \
              -- \
              //codex-rs/cli:codex \
              | grep -E '^(/|bazel-out/)' \
              | tail -n 1
          )"
          if [[ "${cquery_output}" = /* ]]; then
            codex_bazel_output_path="${cquery_output}"
          else
            codex_bazel_output_path="${GITHUB_WORKSPACE}/upstream/${cquery_output}"
          fi
          [[ -e "${codex_bazel_output_path}" ]] || {
            echo "Unable to locate Bazel-built codex at ${codex_bazel_output_path}." >&2
            exit 1
          }
          code_mode_host_output_path="$(${GITHUB_WORKSPACE}/.github/scripts/run-bazel-ci.sh \
            -- \
            cquery \
            --output=files \
            -- \
            //codex-rs/code-mode-host:codex-code-mode-host \
            | grep -E '^(/|bazel-out/)' \
            | tail -n 1)"
          if [[ "${code_mode_host_output_path}" != /* ]]; then
            code_mode_host_output_path="${GITHUB_WORKSPACE}/upstream/${code_mode_host_output_path}"
          fi
          [[ -e "${code_mode_host_output_path}" ]] || {
            echo "Unable to locate the Bazel-built codex code-mode host at ${code_mode_host_output_path}." >&2
            exit 1
          }
          install_dir="${RUNNER_TEMP}/codex-sdk-ci"
          mkdir -p "${install_dir}"
          install -m 755 "${codex_bazel_output_path}" "${install_dir}/codex"
          install -m 755 "${code_mode_host_output_path}" "${install_dir}/codex-code-mode-host"
          echo "CODEX_EXEC_PATH=${install_dir}/codex" >> "${GITHUB_ENV}"

      - name: Warm up Bazel-built codex
        run: "${CODEX_EXEC_PATH} --version"

      - name: Install workspace dependencies
        run: pnpm --dir upstream install --frozen-lockfile

      - name: Build TypeScript SDK packages
        shell: bash
        env:
          CODEX_EXEC_PATH: ${{ runner.temp }}/codex-sdk-ci/codex
        run: |
          set -euo pipefail
          pnpm --dir upstream/sdk/typescript run build

      - name: Lint TypeScript SDK packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir upstream/sdk/typescript run lint

      - name: Test TypeScript SDK packages
        shell: bash
        env:
          CODEX_EXEC_PATH: ${{ runner.temp }}/codex-sdk-ci/codex
        run: |
          set -euo pipefail
          pnpm --dir upstream/sdk/typescript run test

      - name: Shut down Bazel before saving caches
        if: always() && !cancelled()
        shell: bash
        run: bazel shutdown || true

      - name: Save Bazel disk cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream/MODULE.bazel.lock', 'upstream/codex-rs/Cargo.lock', 'patches/openai/codex/ci/**') }}

      - name: Save Bazel repository cache
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prepare_bazel.outputs.repository-cache-path }}
          key: ${{ steps.prepare_bazel.outputs.repository-cache-key }}

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
